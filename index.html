<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRDC — Links</title>
  <meta name="description" content="DJ & Producer. Todos os links e sets de KRDC em um só lugar." />
  <meta name="theme-color" content="#101012" />

  <!-- Open Graph / compartilhamento -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="KRDC — Links" />
  <meta property="og:description" content="DJ & Producer. Todos os links e sets de KRDC em um só lugar." />
  <meta property="og:image" content="src/img/banner.png" />
  <meta property="og:url" content="https://links.krdcmusic.com" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="KRDC — Links" />
  <meta name="twitter:description" content="DJ & Producer. Todos os links e sets de KRDC em um só lugar." />
  <meta name="twitter:image" content="src/img/banner.png" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Google Fonts: Big Shoulders Display (títulos), Archivo (corpo), Source Code Pro (dados) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=Source+Code+Pro:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1608245377444458');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1608245377444458&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>
<body>
  <!-- Marcas de registro nos cantos, extraídas da identidade do banner -->
  <span class="corner-mark corner-mark--tl" aria-hidden="true"></span>
  <span class="corner-mark corner-mark--br" aria-hidden="true"></span>

  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <main id="main" class="page">

    <!-- ===================== HEADER / PERFIL ===================== -->
    <header class="hero" data-animate>
      <div class="hero__frame">
        <div class="hero__photo">
          <img id="avatar-img" src="src/img/avatar.png" alt="KRDC" class="hero__photo-img" />
        </div>
        <h1 class="hero__mark">
          <img id="brand-logo" src="src/img/krdc_white.png" alt="KRDC" class="hero__mark-img" />
        </h1>
      </div>

      <p class="handle" id="profile-handle">@[SEU_USUARIO]</p>
      <p class="bio" id="profile-bio">[Sua bio curta aqui — ex: DJ / Produtor de música eletrônica]</p>
      <p class="tagline" id="profile-tagline">[SUA TAGLINE AQUI]</p>
      <p class="meta" id="profile-meta"></p>
    </header>

    <!-- ===================== REDES SOCIAIS ===================== -->
    <section class="section" aria-labelledby="socials-heading">
      <h2 id="socials-heading" class="section__title">Redes</h2>
      <ul class="socials" id="socials-list"><!-- gerado via JS --></ul>
    </section>

    <!-- ===================== SETS ===================== -->
    <section class="section" aria-labelledby="sets-heading">
      <h2 id="sets-heading" class="section__title">Sets</h2>
      <div class="sets" id="sets-list"><!-- gerado via JS --></div>
    </section>

    <!-- ===================== AGENDA =====================
         Desativada a pedido — os dados continuam em js/data.js
         (SITE_DATA.agenda) e a renderização em js/script.js
         (renderAgenda). Para reativar: descomente a seção abaixo
         e a chamada de renderAgenda() em script.js. -->
    <!--
    <section class="section" aria-labelledby="agenda-heading">
      <h2 id="agenda-heading" class="section__title">Agenda</h2>
      <div class="agenda" id="agenda-list"></div>
    </section>
    -->

    <!-- ===================== FOOTER ===================== -->
    <footer class="footer">
      <p>
        <a id="footer-email" class="footer__email" href="mailto:[SEU EMAIL DE CONTATO]">[SEU EMAIL DE CONTATO]</a>
      </p>
      <p class="footer__copy">© <span id="footer-year"></span> <span id="footer-name">KRDC</span>. Todos os direitos reservados.</p>
    </footer>

  </main>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
